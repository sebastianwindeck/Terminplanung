# =============================================================================
# docker-compose.yml – LOCAL DEVELOPMENT (SQLite)
# For production with PostgreSQL, use azure-deploy.sh or set DATABASE_URL.
#
# Usage:
#   docker compose up -d
#   open http://localhost
# =============================================================================
services:
  backend:
    build: ./backend
    container_name: terminplanung-backend
    restart: unless-stopped
    volumes:
      - db_data:/data
      - terminplanung_storage:/app/storage
    environment:
      - DATABASE_URL=sqlite:////data/terminplanung.db
      - ALLOWED_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:3000"]
      - STORAGE_ROOT=/app/storage
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: terminplanung-frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  terminplanung_storage:
