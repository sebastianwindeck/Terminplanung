version: "3.9"

services:
  backend:
    build: ./backend
    container_name: terminplanung-backend
    restart: unless-stopped
    volumes:
      - db_data:/data
    environment:
      - DATABASE_URL=sqlite:////data/terminplanung.db
      - ALLOWED_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:3000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: terminplanung-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
