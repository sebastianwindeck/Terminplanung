version: "3.9"

# Development: Hot-reload for backend, Vite dev server for frontend
services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - db_data:/data
    environment:
      - DATABASE_URL=sqlite:////data/terminplanung.db
      - ALLOWED_ORIGINS=["http://localhost:3000", "http://127.0.0.1:3000"]
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  db_data:
